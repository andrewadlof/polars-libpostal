# Builds the Zensical site and deploys it to GitHub Pages on every push to main.
# Needs Settings -> Pages -> Source set to "GitHub Actions".
name: Docs
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "zensical.toml"
      - "CHANGELOG.md"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # --only-group docs skips the project itself, so no Rust build is needed.
      - run: uv run --only-group docs zensical build --clean
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
