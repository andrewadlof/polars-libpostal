# Runs the thread-safety stress test under ThreadSanitizer, to back up the claim
# that the libpostal patch has no data races (zero mismatches alone only shows
# that the output is right).
#
# Two variants run:
#   patched  libpostal with the patch. Must report no races.
#   stock    libpostal without it, as a control. Must report races, otherwise a
#            clean `patched` result would not mean anything.
#
# It is slow (it builds an instrumented libpostal and loads the 3 GB model under
# instrumentation), so it runs on demand and on pull requests that touch the patch
# or the scripts, not on every PR. Everything it depends on is pinned, so a schedule
# would only catch runner drift. Run it by hand after bumping the libpostal commit.
name: ThreadSanitizer
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "patches/**"
      - "scripts/build_libpostal.sh"
      - "scripts/stress.c"
      - "scripts/tsan.sh"
      - ".github/workflows/tsan.yml"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tsan:
    name: ThreadSanitizer (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [patched, stock]
    env:
      PREFIX: /opt/libpostal-tsan-${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache the ThreadSanitizer libpostal
        id: libpostal
        uses: actions/cache@v4
        with:
          path: ${{ env.PREFIX }}
          key: libpostal-tsan-${{ matrix.variant }}-${{ runner.os }}-${{ hashFiles('patches/*.patch', 'scripts/build_libpostal.sh', 'scripts/tsan.sh') }}
      - name: Install the build tools
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkg-config
      - name: Prepare the install prefix
        if: steps.libpostal.outputs.cache-hit != 'true'
        run: sudo mkdir -p "$PREFIX" && sudo chown "$USER" "$PREFIX"
      - name: Cache the model data
        id: data
        uses: actions/cache@v4
        with:
          path: ~/.local/share/polars-libpostal
          key: libpostal-data-${{ hashFiles('python/polars_libpostal/_data.py') }}
      - name: Download the model data
        if: steps.data.outputs.cache-hit != 'true'
        # _data.py only needs the standard library, so no install is required.
        run: |
          python3 -c "
          import sys
          sys.path.insert(0, 'python/polars_libpostal')
          import _data
          _data.download_data()
          "
      - name: Generate addresses
        run: |
          python3 - <<'PY'
          import random
          random.seed(0)
          streets = ["Main St", "Oak Avenue", "Rue de Rivoli", "Calle Mayor", "Hauptstrasse"]
          with open("addresses.txt", "w") as f:
              for n in range(1, 3001):
                  f.write(f"{n} {random.choice(streets)}, Apt {n % 17}, City {n % 53}\n")
          PY
      - name: Stress test under ThreadSanitizer
        run: |
          if [ "${{ matrix.variant }}" = stock ]; then export LIBPOSTAL_STOCK=1; fi
          set +e
          LIBPOSTAL_DATA_DIR="$HOME/.local/share/polars-libpostal" \
            scripts/tsan.sh "$PREFIX" addresses.txt 4
          code=$?
          set -e
          if [ "${{ matrix.variant }}" = stock ]; then
            # The control must report races (exit 1). Exit 0 means ThreadSanitizer
            # missed the race, and exit 2 means the run failed or hung without a
            # report, so neither one shows that the tool sees the bug.
            if [ "$code" -ne 1 ]; then
              echo "the control did not report races in stock libpostal (exit $code)"
              exit 1
            fi
            echo "control OK: ThreadSanitizer flags stock libpostal"
          else
            exit "$code"
          fi
      # libpostal's expansion and language classifier keep no shared mutable
      # state, so they need no patch. This checks that on the patched build.
      - name: Expansion stress test under ThreadSanitizer
        if: matrix.variant == 'patched'
        run: |
          LIBPOSTAL_DATA_DIR="$HOME/.local/share/polars-libpostal" \
            scripts/tsan.sh "$PREFIX" addresses.txt 4 expand
