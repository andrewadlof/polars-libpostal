# Builds the Zensical site and deploys it to GitHub Pages on every push to main.
# Needs Settings -> Pages -> Source set to "GitHub Actions".
#
# Build and deploy are separate jobs: deploy-pages looks the artifact up through
# the API, and an artifact uploaded by the job that is still running is not
# found ("No artifacts named github-pages were found").
name: Docs
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "zensical.toml"
      - "CHANGELOG.md"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: astral-sh/setup-uv@v5
      # --only-group docs skips the project itself, so no Rust build is needed.
      - run: uv run --only-group docs zensical build --clean
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
