[project]
site_name = "polars-libpostal"
site_description = "Parallel libpostal address parsing as a Polars expression."
site_url = "https://andrewadlof.github.io/polars-libpostal/"
repo_url = "https://github.com/andrewadlof/polars-libpostal"
repo_name = "andrewadlof/polars-libpostal"
copyright = "Copyright &copy; Drew Adlof"
nav = [
  { "Home" = "index.md" },
  { "Install" = "install.md" },
  { "Usage" = "usage.md" },
  { "How it works" = "architecture.md" },
  { "Building from source" = "building.md" },
  { "Releasing" = "releasing.md" },
  { "Changelog" = "changelog.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
